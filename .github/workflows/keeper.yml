# Runs one Doji keeper pass on Mezo testnet: start auctions on overdue or unsafe loans, cancel recovered ones,
# prepare and settle unsold ones, and finalize matured markets. The contracts re-check every condition, so this
# is a convenience anyone can replace by running the same command.
#
# Triggers are a schedule and a manual run only. It never runs on pull_request or pull_request_target, so code
# from a fork or an unmerged branch never sees KEEPER_PRIVATE_KEY (threat model C20).
# A manual run from any other branch is skipped, so only reviewed code on main ever sees KEEPER_PRIVATE_KEY.
#
# Every 30 minutes is 1,440 runs a month. Each run is billed as at least one minute, so a private repo stays
# inside GitHub's free 2,000 minutes only while a run finishes in under a minute.
name: keeper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doji-keeper
  cancel-in-progress: false

jobs:
  keeper:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/keeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/keeper/package-lock.json

      # No dependency in the lockfile has an install script, so none is allowed to run.
      - run: npm ci --ignore-scripts

      - run: npm run keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          MEZO_TESTNET_RPC: ${{ secrets.MEZO_TESTNET_RPC || 'https://rpc.test.mezo.org' }}
          MEZO_TESTNET_EXPLORER_API: ${{ secrets.MEZO_TESTNET_EXPLORER_API || 'https://api.explorer.test.mezo.org/api' }}
