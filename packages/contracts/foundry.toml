[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# 10, not 200: with the M2b pass-throughs LoanManager must stay 1,000 bytes under the 24,576-byte limit.
optimizer_runs = 10
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
# On 2026-10-21 both boar.network nodes and validationcloud timed out under the fork suites; dRPC ran all 13 clean.
mezo_mainnet = "https://mezo.drpc.org"
