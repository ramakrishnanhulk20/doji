[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# 10, not 200: LoanManager runs close to the 24,576-byte limit (24,193 after the reward operator); any later fix that
# would cross it moves code into the PassThrough library rather than dropping a check.
optimizer_runs = 10
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
# Free public nodes change from week to week: on 2026-10-21 only dRPC ran all 13 fork tests clean, on 2026-10-29
# dRPC dropped connections and validationcloud rate-limited while mezo-mainnet.boar.network ran all 13 clean.
mezo_mainnet = "https://mezo-mainnet.boar.network"
